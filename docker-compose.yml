services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clocking
      POSTGRES_PASSWORD: clocking
      POSTGRES_DB: clocking
    ports:
      - "5432:5432"
    volumes:
      - clocking_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clocking -d clocking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clocking_pg:
